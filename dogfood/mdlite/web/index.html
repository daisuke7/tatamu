<textarea id='src' spellcheck='false'># mdlite

**Tatamu** で書いた Markdown 変換器が、*wasm* としてこのページ内で動いています。

- 入力は左、プレビューは右
- [リンク](https://example.com) や `code` も対応

> 畳んで小さく、広げて動く。

```rs
x := 42
```

  const ex = instance.exports;
  const mem = () => new Uint8Array(ex.memory.buffer);
  const toHtml = (md) => {
    const b = new TextEncoder().encode(md);
    const ptr = Number(ex.md_alloc(b.length));
    mem().set(b, ptr);
    const lenSlot = Number(ex.md_alloc(4));

  src.addEventListener('input', update);
