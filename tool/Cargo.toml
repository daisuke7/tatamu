[package]
name = "tatamu"
version = "0.1.0"
edition = "2021"
description = "Comment/doc externalization for Rust: strip comments into an anchored sidecar ledger, restore them byte-exactly, and query them on demand."
license = "MIT"
repository = "https://github.com/daisuke7/tatamu"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit-mut", "parsing", "printing"] }
prettyplease = "0.2"
quote = "1"
proc-macro2 = "1"
regex = "1"
